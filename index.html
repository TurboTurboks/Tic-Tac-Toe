<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Tic Tac Toe game</title>
</head>

<body>
    <form id="playerForm">
        <label for="first_player">First player name:</label>
        <input type="text" id="first_player" name="first_player" required><br><br>
        <label for="second_player">Second player name:</label>
        <input type="text" id="second_player" name="second_player" required><br><br>
        <input type="submit" value="Submit">
    </form>
    <h2 id="rezultat">REZULTAT:</h2>
    <div class="table">
        <div class="field" id="0"></div>
        <div class="field" id="1"></div>
        <div class="field" id="2"></div>

        <div class="field" id="3"></div>
        <div class="field" id="4"></div>
        <div class="field" id="5"></div>

        <div class="field" id="6"></div>
        <div class="field" id="7"></div>
        <div class="field" id="8"></div>
    </div>
    <p id="pobjednik">Pobjednik je: </p>
    <button id="restart">RESTART</button>
</body>

</html>
